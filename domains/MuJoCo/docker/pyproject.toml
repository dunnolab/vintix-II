[project]
name = "domain"
description = "Setting Up Domain for Vintix II model"
requires-python =">=3.8"
dependencies = [
    "numpy",
    "gymnasium",
    "mujoco<3"
]
authors = [
    {name = "polubarov", email = "polubarov@airi.net"}
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "domain.__version__"}

[tool.setuptools]
py-modules = ["domain"]